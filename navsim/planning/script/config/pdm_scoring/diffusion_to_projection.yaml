#modified from default_run_pdm_score_gpu.yaml
hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra # Store hydra's config breakdown here for debugging
  searchpath: # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False
  hydra_logging:
    level: ERROR
  job_logging:
    level: ERROR

defaults:
  - default_common
  - default_evaluation
  - ddp
  # - scorer: pdm_scorer
  - agent: gtrs_diffusion_policy
  - scorer_agent: gtrs_dense_vov
  - _self_
  # - override train_test_split: navtest
  - override train_test_split: navhard_two_stage

# Minimal experiment identifiers so Hydra's output_dir can be resolved without extra env vars
experiment_name: diffusion_inference
output_dir: ./outputs/${experiment_name}/${experiment_uid}

# If you want to use the NavsimHard dataset instead of the default navsim_logs,
# set the environment variable `NAVSIMHARD_PATH` to the folder containing the
# NavsimHard logs (e.g. /data/.../navsimhard) and this will be used. Otherwise
# the repo defaults will be used.
navsim_log_path: ${oc.env:NAVSIMHARD_PATH}/openscene_meta_datas
synthetic_sensor_path: ${oc.env:NAVSIMHARD_PATH}/sensor_blobs
original_sensor_path: ${oc.env:NAVSIMHARD_PATH}/sensor_blobs
synthetic_scenes_path: ${oc.env:NAVSIMHARD_PATH}/synthetic_scene_pickles

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: "all"
  proposal_sampling: ${proposal_sampling}

#all to generate proposals for all data, one to generate for one example, int to generate int examples
generate_count: 256

#projection related stuff
#determine how many exemplar trajectories to sample
k: 10

#use gtrs scoring or not
use_gtrs_dense_scoring: True

# CUDA device visibility should be set via the CLI (--devices) or the environment.

# Debug / visualization defaults used by gen_traj_and_project.py
debug:
  visualization:
    # If a trajectory's start distance is less than this (meters), apply
    # a projection-time forward shift for visualization only.
    desired_min_dist: 5.5
    # multiplier applied to (desired_min_dist - start_dist) to compute shift
    shift_scale: 1.0
    # optional clamp on per-trajectory shift (meters). Set to null to disable.
    max_shift: 10
    # Enable single-pass adaptive shifting by in-view coverage instead of static shift.
    enable_single_pass_shift: true
    # Desired fraction of points in view in the stitched image (0.0-1.0).
    in_view_threshold: 0.65
    min_length_proportion: 0.5
    # Step size (meters) for each additional shift when in_view < threshold.
    shift_step: 0.5
    # Optional logging of in-view counts before/after in output text.
    log_in_view_counts: true
